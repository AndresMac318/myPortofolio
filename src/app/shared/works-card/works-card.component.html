<div
  class="workscard"
  [style.background-image]="'url(' + cardInfo().urlImg + ')'">
  <div class="workscard__content" (click)="toMoreInfo(cardInfo().title)">
    <div>
      <h3 class="workscard__title">{{ cardInfo().title }}</h3>
      <p class="workscard__text">
        {{ cardInfo().description }}
      </p>
    </div>
    <div>
      <img src="../../../assets/icons/arrow.svg" alt="" />
    </div>
  </div>
</div>
